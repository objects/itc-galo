{% extends "base.html" %}

{% block contenido %}
<div class="reticula reticula--invertida">

    <h2 class="tarjeta__titulo">Error {{ status_code }}</h2>

      <p class="error-codigo">{{ status_code }}</p>

  </section>
</div>
{% endblock %}
