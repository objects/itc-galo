[project]
name = "mcp-bogota-factibilidad"
version = "0.1.0"
description = "Servidor MCP para resolver lotes catastrales de Bogotá con contexto temático y trazabilidad por fuente."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "chromadb>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
# Dependencias de INGESTA de F4 (solo CLI, NO runtime MCP, FR-010): pypdf
# (extracción PDF primaria), python-docx (DOCX) y pdfplumber (alternativa para
# layouts complejos). El servidor MCP no las importa: app/ingesta/actos.py las
# carga perezosamente dentro de las funciones (plan.md:42-46, research D5).
ingesta = [
    "pypdf>=5",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
]
# Feature 5 (interfaz web de prefactibilidad): FastAPI + Jinja2 + HTMX.
# Dependencias SOLO de la capa web (app/web/), NO del runtime MCP: el servidor
# MCP por stdio no las importa.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pypdf>=5",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
]

[project.scripts]
mcp-bogota-factibilidad = "app.main:main"
web-mcp-bogota-factibilidad = "app.web.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.providers", "app.web"]

[tool.setuptools.package-data]
# Feature 5: plantillas Jinja2 y estaticos del paquete web (se empaquetan
# junto con el modulo para que la interfaz funcione instalada, no solo editable).
"app.web" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
