[project]
name = "mcp-bogota-factibilidad"
version = "0.1.0"
description = "Servidor MCP para resolver lotes catastrales de Bogotá con contexto temático y trazabilidad por fuente."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "chromadb>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
# Dependencias de INGESTA de F4 (solo CLI, NO runtime MCP, FR-010): pypdf
# (extracción PDF primaria), python-docx (DOCX) y pdfplumber (alternativa para
# layouts complejos). El servidor MCP no las importa: app/ingesta/actos.py las
# carga perezosamente dentro de las funciones (plan.md:42-46, research D5).
ingesta = [
    "pypdf>=5",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pypdf>=5",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
]

[project.scripts]
mcp-bogota-factibilidad = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
